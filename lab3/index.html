
<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title> Sign Up Page </title>
   <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class = "bg-light">
<main class = "container py-5">
<h1 class="text-center bg-primary text-white p-4 rounded shadow"> Sign Up Form</h1>
<form id="signupForm" action="welcome.html">

  <div class="card-body p-4">
  <div class = "col-md-6">
  <label> First Name:
    <input type="text" id="fName" name="fName" class = "form-control"><br>
  </label>

  <label>Last Name:
     <input type="text" id="lName" name="lName" class = "form-control"><br>
  </label>
  </div>

  Gender:
  <label><input type="radio" name="gender" value="m"> Male</label>
  <label><input type="radio" name="gender" value="f"> Female</label><br>
  <br>
  
  <div class = "col-md-6">
  <label>Zip Code:
     <input type="text" id="zip" name="zip"  class = "form-control"><br>
  </label> <br>

  City: <span id="city"></span>
  Latitude: <span id="latitude"></span>
  Longitude: <span id="longitude"></span>
  </div> <br>

  <label>State:
  <select id="state" name="state" class = "form-control">
    <option value="">Loading states...</option>
  </select><br>
  </label>

  <label>Select a County:
     <select id="county" name="county" class = "form-control">
      <option value="">Select a state</option>
     </select><br>
  </label> <br>

  <label>Desired Username:
     <input type="text" id="username" name="username" class = "form-control">
  </label>
  <span id="usernameError"></span><br>

  <label>Password:
  <input type="password" id="password" name="password" class = "form-control"><br>
  </label>

  <label>Type Password Again:
     <input type="password" id="passwordAgain" name="passwordAgain" class = "form-control"><br>
  </label>
  </div>

  <div class = "col-12">
    <span id="passwordSuggest" class = "form-text"> </span>
    <span id="passwordError" class = "text-danger"></span><br>
  </div>

  <button class = "btn btn-primary w-100">Sign up!</button>
</form>
<script src="js/script.js"></script>
</main>
</body>
</html>
